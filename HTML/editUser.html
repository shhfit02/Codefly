          </label>

            Password (leave blank to keep)
            <input type="password" name="password" class="w-full rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300" placeholder="••••••••" autocomplete="new-password">

              <option value="male">Male</option>
              <option value="female">Female</option>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script>
    const ENDPOINT = "../PHP/editUser.php";

    document.addEventListener("DOMContentLoaded", async () => {
      const { id } = getIdentity();
      if (!id) {
        await Swal.fire({ icon: "error", title: "Missing user identifier." });
        window.location.href = "../HTML/manageUser.html";
        return;
      }
      loadUser(id);
      wireForm();
    });

    function getIdentity() {
      const params = new URLSearchParams(window.location.search);
      return {
        id: params.get("id"),
      };
    }

    function setValue(id, value) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = value ?? "";
    }

    async function loadUser(id) {
      try {
        const res = await fetch(`${ENDPOINT}?id=${encodeURIComponent(id)}`, {
          credentials: "same-origin",
          cache: "no-store",
        });
        const payload = await res.json().catch(() => ({}));
        if (!res.ok || payload?.status !== "success") {
          throw new Error(payload?.message || "Unable to load user.");
        }
        const data = payload.data || {};
        setValue("user-id", data.id || id);
        setValue("username", data.username);
        setValue("full_name", data.full_name);
        setValue("email", data.email);
        setValue("age", data.age ?? "");
        setValue("gender", data.gender || "");
        setValue("level", data.level || "user");
      } catch (err) {
        console.error(err);
        await Swal.fire({ icon: "error", title: "Error", text: err.message || "Unable to load user." });
        window.location.href = "../HTML/manageUser.html";
      }
    }

    function wireForm() {
      const form = document.querySelector("form");
      if (!form) return;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const formData = new FormData(form);
          const res = await fetch(ENDPOINT, {
            method: "POST",
            credentials: "same-origin",
            body: formData,
          });
          const payload = await res.json().catch(() => ({}));
          if (!res.ok || payload?.status !== "success") {
            throw new Error(payload?.message || "Unable to save user.");
          }
          await Swal.fire({ icon: "success", title: payload?.message || "User updated." });
          window.location.href = "../HTML/manageUser.html";
        } catch (err) {
          console.error(err);
          Swal.fire({ icon: "error", title: "Error", text: err.message || "Unable to save user." });
        }
      });
    }
  </script>
