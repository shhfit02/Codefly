<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../Assets/logo4.png">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="auth-page">
  <header>
    <div class="logo">
      <img src="../Assets/codeflyLogo_clean.png" alt="CodeFly Logo">
    </div>
   </header>
  <div class="wrapper">
    <div class="form-box login">
      <h2>Forgot Password</h2>
      <form action="../PHP/forgotPassword.php" method="post" novalidate>
        <div class="input-box">
          <span class="icon"><ion-icon name="mail"></ion-icon></span>
          <input type="email" name="email" id="forgot-email" autocomplete="off" required>
          <label>Enter your email</label>
        </div>
        <button type="submit" class="btn">Next</button>
        <p class="back-login">
           <a href="../index.html">
           <ion-icon name="arrow-back-outline"></ion-icon> Back to Login
           </a>
        </p>

      </form>
    </div>
  </div>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      if (email) {
        const input = document.getElementById('forgot-email');
        if (input) input.value = email;
      }
    })();
  </script>
  <script src="../JS/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <footer class="app-footer">
    COPYRIGHT &copy; 2022 Universiti Pendidikan Sultan Idris
  </footer></body>
</html>
