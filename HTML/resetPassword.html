<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../Assets/logo4.png">
  <title>Reset Password</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="auth-page">
  <header>
    <div class="logo">
      <img src="../Assets/codeflyLogo_clean.png" alt="CodeFly Logo">
    </div>
  </header>

  <div class="wrapper">
    <div class="form-box login">
      <h2>Reset Password</h2>
      <p class="login-register" id="reset-email-text"></p>
      <form action="../PHP/resetPassword.php" method="post" novalidate>
        <input type="hidden" name="email" id="reset-email">

        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" name="new_password" id="new-password" required minlength="8" autocomplete="new-password">
          <label>New Password</label>
        </div>

        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" name="confirm_password" id="confirm-password" required minlength="8" autocomplete="new-password">
          <label>Confirm Password</label>
        </div>

        <button type="submit" class="btn">Update Password</button>

        <p class="back-login">
          <a href="../HTML/forgotPass.html">
            <ion-icon name="arrow-back-outline"></ion-icon> Back
          </a>
        </p>
      </form>
    </div>
  </div>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="../JS/resetPassword.js" defer></script>
  <script src="../JS/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <footer class="app-footer">
    COPYRIGHT &copy; 2022 Universiti Pendidikan Sultan Idris
  </footer></body>
</html>
