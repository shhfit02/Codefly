<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../Assets/logo4.png">
  <title>Verify TAC</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="auth-page">
  <header>
    <div class="logo">
      <img src="../Assets/codeflyLogo_clean.png" alt="CodeFly Logo">
    </div>
  </header>

  <div class="wrapper">
    <div class="form-box login">
      <h2>Verify TAC</h2>
      <p class="instruction" id="tac-instruction">Enter the 6-digit code sent to your email.</p>

      <form action="../PHP/verifyTac.php" method="post" novalidate>
        <input type="hidden" name="email" id="verify-email">
        <div class="input-box">
          <span class="icon"><ion-icon name="key-outline"></ion-icon></span>
          <input type="text" name="tac_code" id="tac-code" maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required>
          <label>Enter TAC Code</label>
        </div>

        <button type="submit" class="btn">Verify</button>

        <p class="resend-tac">
          Didn't receive the code?
          <a id="resendLink" href="../HTML/forgotPass.html">Resend</a>
        </p>
      </form>
    </div>
  </div>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="../JS/verifyTac.js" defer></script>
  <script src="../JS/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <footer class="app-footer">
    COPYRIGHT &copy; 2022 Universiti Pendidikan Sultan Idris
  </footer></body>
</html>
