<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="Assets/logo4.png">
  <title>CodeFly</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="Assets/codeflyLogo_clean.png" alt="CodeFly Logo">
    </div>
    <nav class="navigation" aria-label="Primary">
      <button type="button" class="btnLogin-popup btnLogin-primary" aria-controls="login-panel" aria-expanded="true">
        Login
      </button>
      <a href="HTML/register-profile.html" class="btnLogin-popup">Register</a>
    </nav>
  </header>

  <main>
    <div class="wrapper is-hidden" id="login-panel" data-visible="false" aria-hidden="true">
      <section class="form-box login" aria-labelledby="login-title">
        <h2 id="login-title">Login</h2>
        <form action="PHP/login.php" method="post" novalidate>
        <div class="input-box">
          <span class="icon"><ion-icon name="person"></ion-icon></span>
          <input type="text" name="username" required autocomplete="off">
          <label>Username</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
          <input type="password" name="password" required>
          <label>Password</label>
        </div>
        <div class="remember-forgot">
          <label><input type="checkbox" name="remember" value="1"> Remember me</label>
          <a href="HTML/forgotPass.html">Forgot Password?</a>
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="login-register">
          <p>Don't have an account? <a href="HTML/register-profile.html" class="register-link">Register</a></p>
        </div>
        </form>
        <div class="powered-by" aria-label="Powered by Universiti Pendidikan Sultan Idris">
          <span class="powered-by-label">Powered by</span>
          <img src="Assets/powered.png" alt="Universiti Pendidikan Sultan Idris logo">
        </div>
      </section>
    </div>
  </main>

  <footer class="footer-note">
    <p>COPYRIGHT &copy; 2022 Universiti Pendidikan Sultan Idris</p>
  </footer>

  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="JS/script.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
